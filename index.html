<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazela &amp; Pin — Painel de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0D1B2A;--navy2:#122436;--gold:#C9A84C;--gold-soft:#e3cd8b;--cream:#F5F1E8;--line:rgba(201,168,76,.28);--ok:#2f8f5b;--no:#b1483f;--pend:#8a7a3c;--blue:#4d5fb0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Epilogue',system-ui,sans-serif;background:var(--navy);color:var(--cream);-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit;cursor:pointer;border:none}
img{display:block;max-width:100%}
a{color:var(--gold)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card-login{background:var(--navy2);border:1px solid var(--line);border-radius:18px;padding:34px 28px;width:100%;max-width:380px;text-align:center}
.logo{font-family:'Fraunces';font-weight:700;font-size:30px;color:var(--gold)}
.logo small{display:block;font-family:'Epilogue';font-weight:500;font-size:12px;letter-spacing:3px;color:var(--cream);opacity:.75;margin-top:6px;text-transform:uppercase}
.card-login p{opacity:.7;font-size:14px;margin:16px 0 22px}
.card-login input{width:100%;padding:13px 15px;margin-bottom:12px;border-radius:10px;border:1px solid var(--line);background:#0a1622;color:var(--cream);font-size:15px}
.card-login input:focus{outline:none;border-color:var(--gold)}
.btn-gold{width:100%;background:var(--gold);color:var(--navy);font-weight:700;padding:13px;border-radius:10px;font-size:15px}
.btn-gold:hover{background:var(--gold-soft)}
.err{color:#ff9b8f;font-size:13px;min-height:18px;margin-top:10px}

#app{display:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(13,27,42,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .row1{padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Fraunces';font-weight:700;color:var(--gold);font-size:17px}
.brand span{display:block;color:var(--cream);opacity:.6;font-family:'Epilogue';font-weight:500;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.logout{background:transparent;color:var(--cream);opacity:.7;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.tabs{display:flex;gap:4px;padding:0 12px}
.tab{flex:1;background:transparent;color:var(--cream);opacity:.6;padding:12px 6px;font-size:14px;font-weight:600;border-bottom:2px solid transparent}
.tab.on{opacity:1;color:var(--gold);border-bottom-color:var(--gold)}
.view{display:none}.view.on{display:block}

.filters{display:flex;gap:8px;padding:14px 18px 4px;flex-wrap:wrap}
.chip{background:var(--navy2);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;opacity:.8}
.chip.on{background:var(--gold);color:var(--navy);font-weight:700;opacity:1;border-color:var(--gold)}
.summary{padding:6px 18px 0;font-size:13px;opacity:.6}
.grid{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;max-width:1100px;margin:0 auto}
.post{background:var(--navy2);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.badge{position:absolute;top:10px;left:10px;z-index:3;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.badge.pendente{background:var(--pend);color:#fff}.badge.aprovado{background:var(--ok);color:#fff}
.badge.reprovado{background:var(--no);color:#fff}.badge.publicado{background:var(--gold);color:var(--navy)}.badge.correcao{background:var(--blue);color:#fff}
.carousel{position:relative;background:#0a1622;aspect-ratio:4/5;overflow:hidden}
.carousel img{width:100%;height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(13,27,42,.7);color:var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:3}
.nav.prev{left:8px}.nav.next{right:8px}
.count{position:absolute;bottom:10px;right:10px;background:rgba(13,27,42,.8);color:var(--cream);font-size:12px;padding:3px 9px;border-radius:999px;z-index:3}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:3}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(245,241,232,.35)}.dots i.on{background:var(--gold)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.dia{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dia .when{color:var(--cream);opacity:.6;font-weight:500;letter-spacing:.3px;text-transform:none}
.tema{font-family:'Fraunces';font-size:17px;line-height:1.3;font-weight:600}
.legenda{font-size:13px;line-height:1.5;opacity:.82;white-space:pre-wrap;max-height:0;overflow:hidden;transition:max-height .3s}
.legenda.open{max-height:600px;overflow:auto}
.toggle{background:transparent;color:var(--gold);font-size:12.5px;text-align:left;padding:0;text-decoration:underline;opacity:.9}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.55;margin-bottom:-4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#0a1622;border:1px solid var(--line);color:var(--cream);padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;opacity:.75}
.seg button.on{background:var(--gold);color:var(--navy);opacity:1;border-color:var(--gold)}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:11px;border-radius:9px;font-weight:700;font-size:13.5px;border:1px solid transparent}
.approve{background:rgba(47,143,91,.14);color:#7ee2a6;border-color:rgba(47,143,91,.5)}.approve.on{background:var(--ok);color:#fff}
.reject{background:rgba(177,72,63,.14);color:#ffab9f;border-color:rgba(177,72,63,.5)}.reject.on{background:var(--no);color:#fff}
.corr-toggle{background:rgba(77,95,176,.14);color:#b9c4ff;border:1px solid rgba(77,95,176,.5);border-radius:9px;padding:10px;font-weight:700;font-size:13.5px}
.corr-toggle.on{background:var(--blue);color:#fff}
.corrbox{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.corrbox textarea{width:100%;min-height:76px;resize:vertical;background:#0a1622;border:1px solid var(--line);border-radius:9px;color:var(--cream);padding:10px;font-family:inherit;font-size:13.5px;line-height:1.45}
.corrbox textarea:focus{outline:none;border-color:var(--gold)}
.corr-actions{display:flex;gap:8px}
.btn-send{flex:1;background:var(--gold);color:var(--navy);font-weight:700;border-radius:9px;padding:10px}
.btn-cancel{background:transparent;color:var(--cream);opacity:.7;border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.corr-note{font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:8px}
.corr-note.pendente{background:rgba(138,122,60,.18);color:#e3cd8b}
.corr-note.em_andamento{background:rgba(77,95,176,.2);color:#b9c4ff}
.corr-note.feita{background:rgba(47,143,91,.16);color:#7ee2a6}
.published-note{font-size:12.5px;color:var(--gold)}
.saved{font-size:11.5px;color:#7ee2a6;opacity:0;transition:.2s}.saved.show{opacity:1}

/* CALENDARIO */
.cal{max-width:760px;margin:0 auto;padding:16px}
.cal-item{display:flex;gap:14px;background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;align-items:center}
.cal-date{flex:0 0 62px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.cal-date .d{font-family:'Fraunces';font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.cal-date .wd{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-top:3px}
.cal-date .mo{font-size:11px;opacity:.5}
.cal-main{flex:1;min-width:0}
.cal-main .t{font-family:'Fraunces';font-size:15px;font-weight:600;line-height:1.25}
.cal-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:12px;opacity:.75}
.pill{background:#0a1622;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px}
.pill.st{text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.pill.st.pendente{color:#e3cd8b}.pill.st.aprovado{color:#7ee2a6}.pill.st.publicado{color:var(--gold)}.pill.st.reprovado{color:#ffab9f}.pill.st.correcao{color:#b9c4ff}
.cal-thumb{flex:0 0 54px;height:68px;border-radius:8px;overflow:hidden;background:#0a1622}
.cal-thumb img{width:100%;height:100%;object-fit:cover}
.cal-detail{background:#0a1622;border:1px solid var(--line);border-radius:0 0 14px 14px;margin:-10px 0 10px;padding:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;display:none}
.cal-detail.open{display:block}

/* CORREÇÕES */
.corr-view{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.corr-sec-title{font-family:'Fraunces';font-size:15px;color:var(--gold);margin:6px 0 2px}
.corr-card{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:12px}
.corr-card img{width:50px;height:64px;border-radius:8px;object-fit:cover;background:#0a1622;flex:0 0 50px}
.corr-card .info{flex:1;min-width:0}
.corr-card .t{font-family:'Fraunces';font-size:14px;font-weight:600;line-height:1.25}
.corr-card .ped{font-size:12px;opacity:.72;margin:4px 0 8px;line-height:1.4}
.corr-etapa{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.7;display:flex;justify-content:space-between;align-items:baseline}
.corr-etapa .pc{color:var(--gold);font-weight:700}
.bar{height:8px;background:#0a1622;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:999px;transition:width .5s ease}
.bar.spin > i{background-image:linear-gradient(90deg,var(--gold),var(--gold-soft),var(--gold));background-size:200% 100%;animation:barflow 1.4s linear infinite}
@keyframes barflow{from{background-position:0 0}to{background-position:-200% 0}}
.corr-empty{opacity:.55;font-size:13px;padding:8px 2px;line-height:1.5}
/* GERAR */
.gerar-box{max-width:1100px;margin:0 auto;padding:14px 18px 0}
.gerar-open{width:100%;background:rgba(201,168,76,.12);color:var(--gold);border:1px dashed var(--gold);border-radius:12px;padding:13px;font-weight:700;font-size:14px}
.gerar-form{display:flex;flex-direction:column;gap:9px;margin-top:10px;background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:14px}
.gerar-form textarea{width:100%;min-height:64px;resize:vertical;background:#0a1622;border:1px solid var(--line);border-radius:9px;color:var(--cream);padding:10px;font-family:inherit;font-size:13.5px;line-height:1.45}
.gerar-form textarea:focus{outline:none;border-color:var(--gold)}
.gerar-actions{display:flex;gap:8px}
.gerar-hint{font-size:11.5px;opacity:.6;line-height:1.4}
.sub-toggle{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid var(--line);border-radius:9px;padding:9px;font-weight:700;font-size:13px}
.time-input,.cal-edit input{background:#0a1622;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14px}
.cal-edit{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cal-edit label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.6}
.btn-cal-save{background:var(--gold);color:var(--navy);font-weight:700;border-radius:8px;padding:9px 15px}

/* CONTROLE */
.ctrl{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-size:16px;color:var(--gold);margin-bottom:4px}
.panel .sub{font-size:12.5px;opacity:.6;margin-bottom:14px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch-state{font-family:'Fraunces';font-size:20px;font-weight:700}
.switch-state.ativa{color:#7ee2a6}.switch-state.pausada{color:#ffab9f}
.btn-toggle{padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px}
.btn-pause{background:rgba(177,72,63,.16);color:#ffab9f;border:1px solid rgba(177,72,63,.5)}
.btn-play{background:rgba(47,143,91,.16);color:#7ee2a6;border:1px solid rgba(47,143,91,.5)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.stat{background:#0a1622;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-family:'Fraunces';font-size:24px;font-weight:700;color:var(--gold)}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.6;margin-top:2px}
.metric-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.metric-row img{width:44px;height:56px;border-radius:6px;object-fit:cover;background:#0a1622}
.metric-nums{margin-left:auto;display:flex;gap:12px;font-size:12px;text-align:center;flex-wrap:wrap;justify-content:flex-end}
.metric-nums b{display:block;font-family:'Fraunces';font-size:16px;color:var(--gold)}
.empty{opacity:.55;font-size:13px;padding:6px 0}
.best{border:1px solid var(--gold);border-radius:10px;padding:10px;background:rgba(201,168,76,.08);font-size:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr;padding:12px}}
</style>
</head>
<body>

<div id="login">
  <div class="card-login">
    <div class="logo">Bazela &amp; Pin<small>Painel de Conteúdo</small></div>
    <p>Entre para revisar, aprovar e acompanhar as publicações.</p>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username">
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn-gold" id="btnLogin">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="row1">
      <div class="brand">Bazela &amp; Pin<span>Painel de Conteúdo</span></div>
      <button class="logout" id="btnLogout">Sair</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="aprovacao">Aprovação</button>
      <button class="tab" data-tab="calendario">Calendário</button>
      <button class="tab" data-tab="correcoes">Correções</button>
      <button class="tab" data-tab="controle">Controle</button>
    </div>
  </div>

  <div class="view on" id="view-aprovacao">
    <div class="gerar-box">
      <button class="gerar-open" id="gerarOpen">✨ Gerar novo post</button>
      <div class="gerar-form" id="gerarForm" style="display:none">
        <textarea id="gerarSub" placeholder="Subtema (opcional). Ex.: 'adicional noturno', 'demissão de quem tá doente'. Deixe vazio que o time escolhe um tema novo."></textarea>
        <div class="gerar-actions">
          <button class="btn-send" id="gerarGo">Gerar post</button>
          <button class="btn-cancel" id="gerarClose">Fechar</button>
        </div>
        <div class="gerar-hint">Segue as regras do perfil (curto, natural, OAB, sem repetir tema). Leva alguns minutos — o andamento aparece na aba <b>Correções</b>, e o post entra como <b>pendente</b> pra você aprovar.</div>
      </div>
    </div>
    <div class="filters" id="filters">
      <button class="chip on" data-f="todos">Todos</button>
      <button class="chip" data-f="pendente">Pendentes</button>
      <button class="chip" data-f="aprovado">Aprovados</button>
      <button class="chip" data-f="reprovado">Reprovados</button>
      <button class="chip" data-f="correcao">Correção</button>
      <button class="chip" data-f="publicado">Publicados</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="view" id="view-calendario">
    <div class="cal" id="cal"></div>
  </div>

  <div class="view" id="view-correcoes">
    <div class="corr-view" id="corrview"></div>
  </div>

  <div class="view" id="view-controle">
    <div class="ctrl" id="ctrl"></div>
  </div>
</div>

<script>
const SB_URL="https://rsfhhsnxdsxdmytcihkv.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzZmhoc254ZHN4ZG15dGNpaGt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0OTExNjUsImV4cCI6MjEwMDA2NzE2NX0.aLNTXtMsfbqwixR8B1kLLMI9tgbwIlFMzPn6SknU-Nc";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let POSTS=[],CONFIG={pausado:false},GERACOES=[],FILTER="todos",TAB="aprovacao",SLIDE={},OPEN={},OPENCAL=new Set();

async function boot(){const {data:{session}}=await sb.auth.getSession();session?showApp():($("#login").style.display="flex",$("#app").style.display="none");}
$("#btnLogin").onclick=async()=>{$("#loginErr").textContent="";const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pass").value});if(error){$("#loginErr").textContent="E-mail ou senha inválidos.";return;}showApp();};
$("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#btnLogin").click();});
$("#btnLogout").onclick=async()=>{await sb.auth.signOut();location.reload();};

async function showApp(){$("#login").style.display="none";$("#app").style.display="block";await loadAll();}
async function loadAll(){
  const [p,c,g]=await Promise.all([sb.from("bazela_posts").select("*").order("ordem"),sb.from("bazela_config").select("*").eq("id",1).single(),sb.from("bazela_geracoes").select("*").order("pedido_em",{ascending:false})]);
  POSTS=p.data||[]; if(c.data)CONFIG=c.data; GERACOES=g.data||[]; renderTab();
  wireGerar();
}
let _gerarWired=false;
function wireGerar(){
  if(_gerarWired) return; _gerarWired=true;
  $("#gerarOpen").onclick=()=>{const f=$("#gerarForm");const sh=f.style.display==="none";f.style.display=sh?"flex":"none";if(sh)$("#gerarSub").focus();};
  $("#gerarClose").onclick=()=>{$("#gerarForm").style.display="none";};
  $("#gerarGo").onclick=async()=>{
    const sub=$("#gerarSub").value.trim();
    await sb.from("bazela_geracoes").insert({tipo:"novo",subtema:sub||null,status:"pendente",pedido_em:new Date().toISOString()});
    $("#gerarSub").value="";$("#gerarForm").style.display="none";
    goToCorr();
  };
}
async function pedirSubstituto(slug,sub){
  await sb.from("bazela_geracoes").insert({tipo:"substituto",origem_slug:slug,subtema:sub||null,status:"pendente",pedido_em:new Date().toISOString()});
  goToCorr();
}
function goToCorr(){const t=document.querySelector("[data-tab='correcoes']");if(t)t.click();loadAll();}
$$(".tab").forEach(t=>t.onclick=()=>{TAB=t.dataset.tab;$$(".tab").forEach(x=>x.classList.toggle("on",x===t));$$(".view").forEach(v=>v.classList.toggle("on",v.id==="view-"+TAB));renderTab();manageCorrTimer();});
function renderTab(){ if(TAB==="aprovacao")renderAprov(); else if(TAB==="calendario")renderCal(); else if(TAB==="correcoes")renderCorr(); else renderCtrl(); }
let CORR_TIMER=null;
function manageCorrTimer(){
  if(CORR_TIMER){clearInterval(CORR_TIMER);CORR_TIMER=null;}
  if(TAB==="correcoes"){CORR_TIMER=setInterval(async()=>{
    if(TAB!=="correcoes"){clearInterval(CORR_TIMER);CORR_TIMER=null;return;}
    const [pp,gg]=await Promise.all([sb.from("bazela_posts").select("*").order("ordem"),sb.from("bazela_geracoes").select("*").order("pedido_em",{ascending:false})]);
    if(pp.data)POSTS=pp.data; if(gg.data)GERACOES=gg.data; renderCorr();
  },3000);}
function gerPct(g){if(g.status==="feita")return 100;const base=g.progresso||10;let creep=0;if(g.inicio)creep=Math.floor((Date.now()-new Date(g.inicio).getTime())/5000);return Math.min(95,Math.max(base,base+creep));}
}
function corrPct(p){
  if(p.correcao_status==="feita") return 100;
  const base=p.correcao_progresso||10;
  let creep=0;
  if(p.correcao_inicio){creep=Math.floor((Date.now()-new Date(p.correcao_inicio).getTime())/5000);}
  return Math.min(95,Math.max(base,base+creep));
}
function renderCorr(){
  const prog=POSTS.filter(p=>["pendente","em_andamento"].includes(p.correcao_status));
  const done=POSTS.filter(p=>p.correcao_status==="feita");
  let h=`<div class="summary" style="padding:0 4px 4px">${prog.length} em andamento • ${done.length} concluída(s) aguardando revisão</div>`;
  h+=`<div class="corr-sec-title">Em andamento</div>`;
  if(!prog.length) h+=`<div class="corr-empty">Nenhuma correção rolando agora. Quando você pedir "Corrigir" em um post, ele aparece aqui com a barra de progresso ao vivo.</div>`;
  prog.forEach(p=>{const pct=corrPct(p);const spin=p.correcao_status==="em_andamento"?"spin":"";
    h+=`<div class="corr-card"><img src="${(p.slide_urls||[])[0]||''}"><div class="info">
      <div class="t">Dia ${p.dia} — ${esc((p.tema||'').slice(0,44))}</div>
      <div class="ped">"${esc((p.correcao_pedido||'').slice(0,120))}"</div>
      <div class="corr-etapa"><span>${esc(p.correcao_etapa||(p.correcao_status==="pendente"?"Na fila":"Processando"))}</span><span class="pc">${pct}%</span></div>
      <div class="bar ${spin}"><i style="width:${pct}%"></i></div></div></div>`;});
  if(done.length){h+=`<div class="corr-sec-title" style="margin-top:10px">Concluídas — revise e aprove</div>`;
    done.forEach(p=>{h+=`<div class="corr-card"><img src="${(p.slide_urls||[])[0]||''}"><div class="info">
      <div class="t">Dia ${p.dia} — ${esc((p.tema||'').slice(0,44))}</div>
      <div class="ped" style="color:#7ee2a6">✓ ${esc(p.correcao_resposta||'Correção feita.')}</div>
      <div class="bar"><i style="width:100%"></i></div></div></div>`;});}
  // GERAÇÕES
  const gprog=GERACOES.filter(g=>["pendente","em_andamento"].includes(g.status));
  const gdone=GERACOES.filter(g=>g.status==="feita");
  const gerr=GERACOES.filter(g=>g.status==="erro");
  h+=`<div class="corr-sec-title" style="margin-top:14px">Gerações de conteúdo</div>`;
  if(!gprog.length&&!gdone.length&&!gerr.length) h+=`<div class="corr-empty">Nenhuma geração ainda. Use "✨ Gerar novo post" na aba Aprovação (ou "Gerar substituto" num post reprovado).</div>`;
  gprog.forEach(g=>{const pct=gerPct(g);
    h+=`<div class="corr-card"><div class="info" style="width:100%">
      <div class="t">✨ Gerando ${g.tipo==='substituto'?'substituto':'post novo'}${g.subtema?': '+esc(g.subtema):''}</div>
      <div class="corr-etapa"><span>${esc(g.etapa||'Na fila')}</span><span class="pc">${pct}%</span></div>
      <div class="bar ${g.status==='em_andamento'?'spin':''}"><i style="width:${pct}%"></i></div></div></div>`;});
  gdone.forEach(g=>{const post=POSTS.find(p=>p.slug===g.resultado_slug);
    h+=`<div class="corr-card">${post?`<img src="${(post.slide_urls||[])[0]||''}">`:''}<div class="info">
      <div class="t">✓ Gerado: ${esc(g.resultado_tema||g.resultado_slug||'novo post')}</div>
      <div class="ped" style="color:#7ee2a6">Entrou como pendente pra você aprovar.</div>
      <div class="bar"><i style="width:100%"></i></div></div></div>`;});
  gerr.forEach(g=>{h+=`<div class="corr-card"><div class="info">
      <div class="t">⚠️ Geração falhou${g.subtema?': '+esc(g.subtema):''}</div>
      <div class="ped" style="color:#ffab9f">${esc(g.erro||'Tente de novo.')}</div></div></div>`;});
  $("#corrview").innerHTML=h;
}

/* ---------- APROVAÇÃO ---------- */
$$(".chip").forEach(c=>c.onclick=()=>{$$(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");FILTER=c.dataset.f;renderAprov();});
function renderAprov(){
  const list=FILTER==="todos"?POSTS:POSTS.filter(p=>p.status===FILTER);
  const c={pend:POSTS.filter(p=>p.status==='pendente').length,ap:POSTS.filter(p=>p.status==='aprovado').length,pb:POSTS.filter(p=>p.status==='publicado').length};
  $("#summary").textContent=`${POSTS.length} publicações • ${c.pend} pendentes • ${c.ap} aprovadas • ${c.pb} publicadas`;
  const g=$("#grid");g.innerHTML="";
  list.forEach(p=>{
    if(SLIDE[p.id]===undefined)SLIDE[p.id]=0;const urls=p.slide_urls||[];
    const el=document.createElement("div");el.className="post";
    el.innerHTML=`
      <div style="position:relative">
        <span class="badge ${p.status}">${p.status}</span>
        <div class="carousel">
          <img src="${urls[SLIDE[p.id]]||''}">
          ${urls.length>1?`<button class="nav prev" data-id="${p.id}" data-d="-1">‹</button><button class="nav next" data-id="${p.id}" data-d="1">›</button><span class="count">${SLIDE[p.id]+1}/${urls.length}</span><div class="dots">${urls.map((_,i)=>`<i class="${i===SLIDE[p.id]?'on':''}"></i>`).join("")}</div>`:''}
        </div>
      </div>
      <div class="body">
        <div class="dia"><span>Dia ${p.dia}</span><span class="when">${p.data_agendada?fmtShort(p.data_agendada)+' · '+(p.hora_agendada||'')+'h':''}</span></div>
        <div class="tema">${esc(p.tema||'')}</div>
        <button class="toggle" data-id="${p.id}">Ver legenda ▾</button>
        <div class="legenda" id="leg-${p.id}">${esc(p.caption||'')}</div>
        <div><div class="lbl">Formato</div><div class="seg" data-id="${p.id}">${['feed','story','reels'].map(f=>`<button data-fmt="${f}" class="${p.formato===f?'on':''}">${cap(f)}</button>`).join("")}</div></div>
        ${p.status==='publicado'
          ?`<div class="published-note">✓ Publicado${p.media_permalink?` — <a href="${p.media_permalink}" target="_blank">ver no Instagram</a>`:''}</div>`
          :`<div class="actions" data-id="${p.id}"><button class="approve ${p.status==='aprovado'?'on':''}" data-act="aprovado">✓ Aprovar</button><button class="reject ${p.status==='reprovado'?'on':''}" data-act="reprovado">✕ Reprovar</button></div>
            <button class="corr-toggle ${p.status==='correcao'?'on':''}" data-id="${p.id}">✎ Corrigir</button>
            <div class="corrbox" id="corr-${p.id}" style="display:${p.status==='correcao'&&p.correcao_status!=='feita'?'flex':'none'}"><textarea id="ct-${p.id}" placeholder="Escreva o que precisa ser corrigido (texto, imagem, dado, cor...).">${esc(p.correcao_pedido||'')}</textarea><div class="corr-actions"><button class="btn-send" data-id="${p.id}">Enviar correção</button><button class="btn-cancel" data-id="${p.id}">Fechar</button></div></div>
            ${p.status==='reprovado'?`<button class="sub-toggle" data-id="${p.id}">✨ Gerar um substituto</button><div class="corrbox" id="sub-${p.id}" style="display:none"><textarea id="subt-${p.id}" placeholder="Subtema do substituto (opcional). Vazio = o time escolhe."></textarea><div class="corr-actions"><button class="btn-sub-send" data-id="${p.id}" data-slug="${p.slug}">Gerar substituto</button><button class="btn-sub-cancel" data-id="${p.id}">Fechar</button></div></div>`:''}`}
        ${p.correcao_status?`<div class="corr-note ${p.correcao_status}">${corrNote(p)}</div>`:''}
        <span class="saved" id="sv-${p.id}">salvo ✓</span>
      </div>`;
    g.appendChild(el);
  });
  g.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{const id=+b.dataset.id,d=+b.dataset.d,n=(POSTS.find(x=>x.id===id).slide_urls||[]).length;SLIDE[id]=(SLIDE[id]+d+n)%n;renderAprov();});
  g.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>{const l=$("#leg-"+b.dataset.id);l.classList.toggle("open");b.textContent=l.classList.contains("open")?"Ocultar legenda ▴":"Ver legenda ▾";});
  g.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.onclick=()=>save(+s.dataset.id,{formato:b.dataset.fmt})));
  g.querySelectorAll(".actions").forEach(a=>a.querySelectorAll("button").forEach(b=>b.onclick=()=>save(+a.dataset.id,{status:b.dataset.act})));
  g.querySelectorAll(".corr-toggle").forEach(b=>b.onclick=()=>{const bx=$("#corr-"+b.dataset.id),sh=bx.style.display==="none";bx.style.display=sh?"flex":"none";if(sh)$("#ct-"+b.dataset.id).focus();});
  g.querySelectorAll(".btn-cancel").forEach(b=>b.onclick=()=>{$("#corr-"+b.dataset.id).style.display="none";});
  g.querySelectorAll(".btn-send").forEach(b=>b.onclick=()=>{const id=+b.dataset.id,t=$("#ct-"+id).value.trim();if(!t){$("#ct-"+id).focus();return;}save(id,{status:"correcao",correcao_pedido:t,correcao_status:"pendente",correcao_resposta:null,correcao_em:new Date().toISOString()});});
  g.querySelectorAll(".sub-toggle").forEach(b=>b.onclick=()=>{const bx=$("#sub-"+b.dataset.id);const sh=bx.style.display==="none";bx.style.display=sh?"flex":"none";if(sh)$("#subt-"+b.dataset.id).focus();});
  g.querySelectorAll(".btn-sub-cancel").forEach(b=>b.onclick=()=>{$("#sub-"+b.dataset.id).style.display="none";});
  g.querySelectorAll(".btn-sub-send").forEach(b=>b.onclick=()=>{pedirSubstituto(b.dataset.slug,$("#subt-"+b.dataset.id).value.trim());});
}
function corrNote(p){const q=esc(p.correcao_pedido||"");if(p.correcao_status==="pendente")return `⏳ Correção solicitada: "${q}" — na fila do time.`;if(p.correcao_status==="em_andamento")return `🔧 O time está corrigindo: "${q}"`;if(p.correcao_status==="feita")return `✓ Correção feita${p.correcao_resposta?': '+esc(p.correcao_resposta):''}. Revise e aprove.`;return "";}
async function save(id,patch){const p=POSTS.find(x=>x.id===id);Object.assign(p,patch);const {error}=await sb.from("bazela_posts").update({...patch,updated_at:new Date().toISOString()}).eq("id",id);renderTab();if(!error){const s=$("#sv-"+id);if(s){s.classList.add("show");setTimeout(()=>s.classList.remove("show"),1200);}}}

/* ---------- CALENDÁRIO ---------- */
function renderCal(){
  const list=[...POSTS].filter(p=>p.data_agendada).sort((a,b)=>a.data_agendada.localeCompare(b.data_agendada));
  const box=$("#cal");
  box.innerHTML=`<div class="summary" style="padding:0 4px 10px">Cronograma previsto — 1 post/dia útil, ${CONFIG.hora_padrao||'18:00'}h padrão. Clique num dia pra ver o post e ajustar data/hora.</div>`;
  list.forEach(p=>{
    const urls=p.slide_urls||[];const dt=new Date(p.data_agendada+"T00:00:00");
    const it=document.createElement("div");
    it.innerHTML=`
      <div class="cal-item" data-id="${p.id}">
        <div class="cal-date"><div class="d">${String(dt.getDate()).padStart(2,'0')}</div><div class="wd">${dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div><div class="mo">${dt.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</div></div>
        <div class="cal-main"><div class="t">${esc(p.tema||'')}</div><div class="cal-meta"><span class="pill">🕕 ${p.hora_agendada||'18:00'}h</span><span class="pill">${cap(p.formato||'feed')}</span><span class="pill st ${p.status}">${p.status}</span></div></div>
        <div class="cal-thumb"><img src="${urls[0]||''}"></div>
      </div>
      <div class="cal-detail ${OPENCAL.has(p.id)?'open':''}" id="cd-${p.id}"><b>Dia ${p.dia} — ${fmtLong(p.data_agendada)} às ${p.hora_agendada||'18:00'}h</b>\n\n${esc(p.caption||'')}\n\n${p.status==='publicado'&&p.media_permalink?'✓ Publicado: '+p.media_permalink:''}${p.status!=='publicado'?`<div class="cal-edit"><label>Data<input type="date" id="ce-data-${p.id}" value="${p.data_agendada||''}"></label><label>Hora<input type="time" id="ce-hora-${p.id}" value="${p.hora_agendada||'18:00'}"></label><button class="btn-cal-save" data-id="${p.id}">Salvar</button><span class="saved" id="ce-sv-${p.id}">salvo ✓</span></div>`:''}</div>`;
    box.appendChild(it);
  });
  box.querySelectorAll(".cal-item").forEach(it=>it.onclick=()=>{const id=+it.dataset.id;const d=$("#cd-"+id);const op=d.classList.toggle("open");op?OPENCAL.add(id):OPENCAL.delete(id);});
  box.querySelectorAll(".btn-cal-save").forEach(b=>b.onclick=async(e)=>{e.stopPropagation();const id=+b.dataset.id;const data=$("#ce-data-"+id).value;const hora=$("#ce-hora-"+id).value||"18:00";const p=POSTS.find(x=>x.id===id);const upd={hora_agendada:hora};if(data)upd.data_agendada=data;Object.assign(p,upd);OPENCAL.add(id);await sb.from("bazela_posts").update(upd).eq("id",id);renderCal();const s=$("#ce-sv-"+id);if(s){s.classList.add("show");setTimeout(()=>s.classList.remove("show"),1400);}});
}

/* ---------- CONTROLE ---------- */
function renderCtrl(){
  const pub=POSTS.filter(p=>p.status==='publicado');
  const ap=POSTS.filter(p=>p.status==='aprovado');
  const next=[...POSTS].filter(p=>p.status==='aprovado'&&p.data_agendada).sort((a,b)=>a.data_agendada.localeCompare(b.data_agendada))[0];
  const sum=k=>pub.reduce((s,p)=>s+(p[k]||0),0);
  const best=pub.filter(p=>p.m_reach!=null).sort((a,b)=>(b.m_reach||0)-(a.m_reach||0))[0];
  const paused=CONFIG.pausado;
  $("#ctrl").innerHTML=`
    <div class="panel">
      <h3>Automação de publicação</h3>
      <div class="sub">Quando pausada, nenhum post aprovado é publicado até você retomar.</div>
      <div class="switch-row">
        <div>Status: <span class="switch-state ${paused?'pausada':'ativa'}">${paused?'PAUSADA':'ATIVA'}</span></div>
        <button class="btn-toggle ${paused?'btn-play':'btn-pause'}" id="btnPause">${paused?'▶ Retomar':'⏸ Pausar tudo'}</button>
      </div>
    </div>
    <div class="panel">
      <h3>Horário padrão de publicação</h3>
      <div class="sub">Vale para os próximos posts gerados. Você pode aplicar a todos os agendados também.</div>
      <div class="switch-row" style="flex-wrap:wrap;gap:10px">
        <input type="time" id="horaPadrao" class="time-input" value="${CONFIG.hora_padrao||'18:00'}">
        <div style="display:flex;gap:8px">
          <button class="btn-toggle btn-play" id="btnHoraSalvar">Salvar padrão</button>
          <button class="btn-toggle" id="btnHoraAplicar" style="background:rgba(201,168,76,.14);color:var(--gold);border:1px solid var(--line)">Aplicar a todos</button>
        </div>
      </div>
      <span class="saved" id="svHora">salvo ✓</span>
    </div>
    <div class="panel">
      <h3>Fila</h3>
      <div class="stat-grid" style="margin-top:6px">
        <div class="stat"><div class="n">${POSTS.filter(p=>p.status==='pendente').length}</div><div class="l">Pendentes</div></div>
        <div class="stat"><div class="n">${ap.length}</div><div class="l">Aprovados</div></div>
        <div class="stat"><div class="n">${pub.length}</div><div class="l">Publicados</div></div>
        <div class="stat"><div class="n">${POSTS.filter(p=>p.status==='correcao').length}</div><div class="l">Correção</div></div>
      </div>
      ${next?`<div class="empty" style="margin-top:12px;opacity:.85">Próximo agendado: <b>${esc(next.tema)}</b> — ${fmtLong(next.data_agendada)} às ${next.hora_agendada||'18:00'}h</div>`:`<div class="empty" style="margin-top:12px">Nenhum post aprovado na fila. Aprove na aba Aprovação.</div>`}
    </div>
    <div class="panel">
      <h3>Métricas dos posts publicados</h3>
      <div class="sub">Visualizações, alcance e engajamento (atualiza conforme o Instagram libera os dados).</div>
      <div class="stat-grid">
        <div class="stat"><div class="n">${fmtN(sum('m_views'))}</div><div class="l">Interações</div></div>
        <div class="stat"><div class="n">${fmtN(sum('m_reach'))}</div><div class="l">Alcance</div></div>
        <div class="stat"><div class="n">${fmtN(sum('m_likes'))}</div><div class="l">Curtidas</div></div>
        <div class="stat"><div class="n">${fmtN(sum('m_saved'))}</div><div class="l">Salvos</div></div>
      </div>
      ${best&&best.m_reach?`<div class="best" style="margin-top:12px">🏆 Mais engajou: <b>${esc(best.tema)}</b> — ${fmtN(best.m_reach)} de alcance, ${fmtN(best.m_likes)} curtidas.</div>`:''}
      <div style="margin-top:12px">
        ${pub.length?pub.map(p=>`<div class="metric-row"><img src="${(p.slide_urls||[])[0]||''}"><div style="min-width:0"><div style="font-size:13px;font-weight:600">${esc((p.tema||'').slice(0,46))}</div><div style="font-size:11px;opacity:.55">${p.data_agendada?fmtShort(p.data_agendada):''} ${p.media_permalink?'· <a href="'+p.media_permalink+'" target="_blank">Instagram</a>':''}</div></div><div class="metric-nums"><span><b>${p.m_reach!=null?fmtN(p.m_reach):'—'}</b>alcance</span><span><b>${p.m_likes!=null?fmtN(p.m_likes):'—'}</b>likes</span><span><b>${p.m_saved!=null?fmtN(p.m_saved):'—'}</b>salvos</span></div></div>`).join(""):'<div class="empty">Nenhum post publicado ainda.</div>'}
      </div>
      ${pub.length&&!best?.m_reach?'<div class="empty" style="margin-top:8px">As métricas aparecem aqui assim que o Instagram processar as visualizações dos posts.</div>':''}
    </div>`;
  const bt=$("#btnPause");if(bt)bt.onclick=async()=>{CONFIG.pausado=!paused;await sb.from("bazela_config").update({pausado:CONFIG.pausado,updated_at:new Date().toISOString()}).eq("id",1);renderCtrl();};
  const bs=$("#btnHoraSalvar");if(bs)bs.onclick=async()=>{const h=$("#horaPadrao").value||"18:00";CONFIG.hora_padrao=h;await sb.from("bazela_config").update({hora_padrao:h}).eq("id",1);const s=$("#svHora");if(s){s.classList.add("show");setTimeout(()=>s.classList.remove("show"),1400);}};
  const ba=$("#btnHoraAplicar");if(ba)ba.onclick=async()=>{const h=$("#horaPadrao").value||"18:00";if(!confirm("Aplicar "+h+" a TODOS os posts ainda não publicados? Isso sobrescreve os horários individuais que você tenha ajustado."))return;CONFIG.hora_padrao=h;await sb.from("bazela_config").update({hora_padrao:h}).eq("id",1);await sb.from("bazela_posts").update({hora_agendada:h}).neq("status","publicado");POSTS.forEach(p=>{if(p.status!=="publicado")p.hora_agendada=h;});const s=$("#svHora");if(s){s.classList.add("show");setTimeout(()=>s.classList.remove("show"),1400);}renderCtrl();};
}

/* helpers */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s;}
function fmtN(n){return n==null?'—':n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':''+n;}
function fmtShort(iso){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtLong(iso){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});}
boot();
</script>
</body>
